<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Half Star Rating</title>

<style>
body{
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:transparent;
    font-family:sans-serif;
}

.rating{
    display:flex;
    flex-direction:row-reverse;
    gap:2px;
}

.rating input{
    display:none;
}

.rating label{
    position:relative;
    width:24px;
    font-size:42px;
    color:#ccc;
    cursor:pointer;
}

/* Full star */
.rating label::before{
    content:"★";
}

/* Half star clickable area */
.rating label.half{
    width:12px;
    overflow:hidden;
    margin-right:-12px;
    z-index:2;
}

/* Hover */
.rating label:hover,
.rating label:hover ~ label{
    color:#FFD700;
}

/* Selected */
.rating input:checked ~ label{
    color:#FFD700;
}
</style>
</head>

<body>

<div class="rating" id="rating">

<input type="radio" id="star10" name="rating" value="5">
<label for="star10"></label>

<input type="radio" id="star9" name="rating" value="4.5">
<label class="half" for="star9"></label>

<input type="radio" id="star8" name="rating" value="4">
<label for="star8"></label>

<input type="radio" id="star7" name="rating" value="3.5">
<label class="half" for="star7"></label>

<input type="radio" id="star6" name="rating" value="3">
<label for="star6"></label>

<input type="radio" id="star5" name="rating" value="2.5">
<label class="half" for="star5"></label>

<input type="radio" id="star4" name="rating" value="2">
<label for="star4"></label>

<input type="radio" id="star3" name="rating" value="1.5">
<label class="half" for="star3"></label>

<input type="radio" id="star2" name="rating" value="1">
<label for="star2"></label>

<input type="radio" id="star1" name="rating" value="0.5">
<label class="half" for="star1"></label>

</div>

<script>
const inputs = document.querySelectorAll('input[name="rating"]');

let rating = parseFloat(localStorage.getItem("rating")) || 0;

function loadRating(){
    inputs.forEach(input=>{
        input.checked = parseFloat(input.value) === rating;
    });
}

loadRating();

inputs.forEach(input=>{
    input.addEventListener("click", function(e){

        const value = parseFloat(this.value);

        if(value === rating){
            e.preventDefault();
            this.checked = false;
            rating = 0;
            localStorage.removeItem("rating");
        }else{
            rating = value;
            localStorage.setItem("rating", rating);
        }

        loadRating();
    });
});
</script>

</body>
</html>
